{% extends "base.html" %}
{% block title %}Customer Login · Lavender Lounge{% endblock %}
{% block content %}
<div class="narrow">
  <a class="back" href="{{ url_for('home') }}">← Back</a>
  <form class="panel form-card" method="post">
    <span class="eyebrow">Returning customer</span>
    <h1>Open my loyalty card</h1>

    <label>Email</label>
    <input type="email" name="email" placeholder="you@example.com" required>

    <button>Send login code</button>
    <p class="tiny">No password needed. We will send a secure 6-digit code to your email.</p>
  </form>
</div>
{% endblock %}
